<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Switcher</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: black;
        }

        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #textBox {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 15px 25px;
            font-size: 1.2em;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
        }
    </style>
    <link href="styles.css" rel="stylesheet" type="text/css">
</head>
<body>
    <video id="videoPlayer" autoplay muted playsinline loop>
        <source src="videos/video_01.mp4" type="video/mp4">
        Your browser does not support HTML5 video.
    </video>

    <div id="textBox">Being honest is not always the kindest way.</div>

    <script src="script.js"></script>
</body>
</html>
